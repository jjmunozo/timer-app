<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1 es más que cero timer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1 class="main-title">1 > 0 Timer</h1>
        <div id="taskInput" class="task-input">
            <input type="text" id="taskName" placeholder="¿En qué vas a trabajar?">
            <button id="confirmTask">Comenzar</button>
        </div>
        <div id="timerContainer" class="hidden">
            <div id="currentTask" class="task-title"></div>
            <div id="timer">00:00</div>
            <div id="nextLevel"></div>
            <div class="buttons">
                <button id="startBtn">Comenzar</button>
                <button id="stopBtn" class="hidden">Parar</button>
            </div>
            <div id="messages" class="messages"></div>
            <div class="sound-control">
                <p class="sound-title">Acompañá tu trabajo con sonidos productivos:</p>
                <div class="sound-buttons">
                    <button class="sound-option" data-sound="white">🎧</button>
                    <button class="sound-option" data-sound="rain">☔</button>
                    <button class="sound-option" data-sound="jungle">🌳</button>
                </div>
                <div class="volume-control hidden">
                    <input type="range" id="volumeSlider" min="0" max="100" value="50">
                    <span id="volumeIcon">🔊</span>
                </div>
            </div>
        </div>
    </div>
    <audio id="whiteNoise" loop>
        <source src="sounds/whitenoise.wav" type="audio/wav">
    </audio>
    <audio id="rainSound" loop>
        <source src="sounds/rain.wav" type="audio/wav">
    </audio>
    <audio id="jungleSound" loop>
        <source src="sounds/jungle.wav" type="audio/wav">
    </audio>
    <script src="script.js"></script>
</body>
</html>
